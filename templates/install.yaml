# GENERATED by tools/build_install.py from templates/src/install.src.yaml. Don't edit this file.
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  DebugLogManager install, in the tools account: the VM (no inbound ports, no
  SSH key), its role, the audit bucket (Object Lock), and the reader and
  worker StackSets deployed to the accounts in scope. The tools account must
  be a StackSets delegated administrator (see the install steps). Built from
  templates/src/install.src.yaml by tools/build_install.py: edit the source,
  not templates/install.yaml.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Network }
        Parameters: [SubnetId, VpcId]
      - Label: { default: Scope }
        Parameters: [ScopeOrganizationalUnitIds, ExcludedAccountIds]
      - Label: { default: Sign-in }
        Parameters: [AdminPermissionSets, IdentityCenterAccountId, IdentityCenterRegion]
      - Label: { default: Debugging }
        Parameters: [OfferedRegions]
      - Label: { default: VM }
        Parameters: [ImageId, InstanceType, AmiParameter]
      - Label: { default: Marketplace }
        Parameters: [ProductCode]

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC of the subnet.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: A subnet with outbound internet access (a NAT gateway, or a public subnet). Nothing reaches the VM from outside.
  ScopeOrganizationalUnitIds:
    Type: CommaDelimitedList
    Description: Where DebugLogManager can debug. OU ids (ou-...), or the root id (r-...) for the whole organization. Accounts added to these OUs later are covered automatically.
  ExcludedAccountIds:
    Type: CommaDelimitedList
    Default: ""
    Description: Accounts under those OUs to leave out (12-digit ids, comma separated), or empty.
  AdminPermissionSets:
    Type: String
    Default: AdministratorAccess,AWSAdministratorAccess
    Description: IAM Identity Center permission sets that sign in to DebugLogManager as Admin (the rest are Users).
  IdentityCenterAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
    Description: The account that runs IAM Identity Center (the management account, or its delegated administrator). It holds the DebugLogManager-identity-reader role (the management stack).
  IdentityCenterRegion:
    Type: String
    Default: us-east-1
    Description: IAM Identity Center's home region.
  OfferedRegions:
    Type: CommaDelimitedList
    Description: Regions DebugLogManager offers for debugging, e.g. eu-west-1,us-east-1.
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: The DebugLogManager image (supplied by AWS Marketplace).
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small, t4g.medium, t4g.large]
  AmiParameter:
    Type: String
    Default: ""
    Description: SSM parameter naming the newest DebugLogManager image, for the Update button (supplied by AWS Marketplace).
  ProductCode:
    Type: String
    Default: ""
    Description: Marketplace product code, for metering (supplied by AWS Marketplace).

Conditions:
  HasExcluded: !Not [!Equals [!Join ["", !Ref ExcludedAccountIds], ""]]

Resources:
  # ── The VM's role: everything DebugLogManager does starts here ─────────────
  VmRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: DebugLogManager-vm
      Description: The DebugLogManager VM. Changes nothing itself; assumes the reader and worker roles to read and change logging.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        - PolicyName: debuglogmanager
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AssumeDebugLogManagerRoles
                Effect: Allow
                Action: ["sts:AssumeRole", "sts:SetSourceIdentity"]
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::*:role/DebugLogManager-reader"
                  - !Sub "arn:${AWS::Partition}:iam::*:role/DebugLogManager-worker"
                  - !Sub "arn:${AWS::Partition}:iam::${IdentityCenterAccountId}:role/DebugLogManager-identity-reader"
              - Sid: StateAndAudit
                Effect: Allow
                Action: ["s3:GetObject", "s3:PutObject", "s3:ListBucket"]
                Resource: [!GetAtt StateBucket.Arn, !Sub "${StateBucket.Arn}/*"]
              - Sid: ReadStackSets
                Effect: Allow
                Action: ["cloudformation:ListStackInstances", "cloudformation:DescribeStackInstance", "cloudformation:DescribeStackSet",
                         "cloudformation:ListStackSetOperations", "cloudformation:ListStackSetOperationResults",
                         "organizations:ListDelegatedAdministrators"]
                Resource: "*"
              - Sid: WhoChangedWhatsAllowed
                Effect: Allow
                Action: cloudtrail:LookupEvents
                Resource: "*"
              - Sid: SignInSessionCheck
                Effect: Allow
                Action: ssm:DescribeSessions
                Resource: "*"
              - Sid: NewestImage
                Effect: Allow
                Action: ssm:GetParameter
                Resource: "*"
              - Sid: Metering
                Effect: Allow
                Action: aws-marketplace:MeterUsage
                Resource: "*"
              # The Update button: UpdateStack on this stack with the previous
              # template and only ImageId changed. No service role is passed
              # (CloudFormation would keep it on the stack and run every later
              # upgrade with it), so CloudFormation acts with this role, and
              # what follows is all it can do: replace this stack's VM. It
              # has no IAM write, so no update can change its own permissions.
              - Sid: UpdateOwnStack
                Effect: Allow
                Action: ["cloudformation:DescribeStacks", "cloudformation:DescribeStackEvents", "cloudformation:UpdateStack"]
                Resource: !Ref AWS::StackId
              - Sid: ReplaceTheVm
                Effect: Allow
                Action: ["ec2:RunInstances", "ec2:CreateTags", "ec2:Describe*", "ssm:GetParameters"]
                Resource: "*"
              - Sid: TerminateOnlyThisStacksVm
                Effect: Allow
                Action: ec2:TerminateInstances
                Resource: "*"
                Condition: { StringEquals: { "aws:ResourceTag/aws:cloudformation:stack-id": !Ref AWS::StackId } }
              - Sid: PassOwnRoleToTheNewVm
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/DebugLogManager-vm"
                Condition: { StringEquals: { iam:PassedToService: ec2.amazonaws.com } }
              - Sid: ReadOwnRole
                Effect: Allow
                Action: iam:GetRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/DebugLogManager-vm"

  VmProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: DebugLogManager-vm
      Roles: [!Ref VmRole]

  # ── State and audit: Object Lock, Governance mode, 1 year ──────────────────
  # Kept when the stack is deleted (its entries are locked): empty and delete
  # it with the command on the website once you no longer need the audit.
  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule: { DefaultRetention: { Mode: GOVERNANCE, Days: 365 } }
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      Tags: [{ Key: dlm:managed, Value: "true" }]

  # ── The VM: no inbound rules, no key, IMDSv2 only ──────────────────────────
  VmSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: DebugLogManager VM. No inbound rules; reached only through SSM port forwarding.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: AWS APIs over HTTPS }
      Tags: [{ Key: Name, Value: debuglogmanager }]

  Vm:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref VmSecurityGroup]
      IamInstanceProfile: !Ref VmProfile
      MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 1, HttpEndpoint: enabled }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags: [{ Key: Name, Value: debuglogmanager }]
      # The app's settings: written at every boot of a new VM, never baked
      # into the image.
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -e
            install -d -m 0750 -o debuglogmanager -g debuglogmanager /etc/debuglogmanager /var/lib/debuglogmanager
            cat > /etc/debuglogmanager/env <<'ENV'
            DLM_MODE=aws
            DLM_STORE=s3
            DLM_STATE_BUCKET=${StateBucket}
            DLM_HOME_REGION=${AWS::Region}
            DLM_PAIRS_REGION=${AWS::Region}
            DLM_EXTERNAL_ID=${ExternalId}
            DLM_REGIONS=${Regions}
            DLM_ADMIN_PERMISSION_SETS=${AdminPermissionSets}
            DLM_IDENTITY_ROLE_ARN=arn:${AWS::Partition}:iam::${IdentityCenterAccountId}:role/DebugLogManager-identity-reader
            DLM_IDENTITY_REGION=${IdentityCenterRegion}
            DLM_STACK_NAME=${AWS::StackName}
            DLM_AMI_PARAMETER=${AmiParameter}
            DLM_PRODUCT_CODE=${ProductCode}
            DLM_DATA_DIR=/var/lib/debuglogmanager
            ENV
            chmod 0640 /etc/debuglogmanager/env
            chown root:debuglogmanager /etc/debuglogmanager/env
            systemctl restart debuglogmanager
          - ExternalId: !Select [2, !Split ["/", !Ref AWS::StackId]]
            Regions: !Join [",", !Ref OfferedRegions]

  # ── The accounts in scope: reader and worker roles, by StackSet ────────────
  # One region only: they're IAM roles. Managed from this account as
  # StackSets delegated administrator; accounts joining a scoped OU get them
  # automatically.
  ReaderStackSet:
    Type: AWS::CloudFormation::StackSet
    Properties:
      StackSetName: DebugLogManager-reader
      Description: DebugLogManager reader role (read-only) in every account in scope.
      PermissionModel: SERVICE_MANAGED
      CallAs: DELEGATED_ADMIN
      AutoDeployment: { Enabled: true, RetainStacksOnAccountRemoval: false }
      ManagedExecution: { Active: true }
      Capabilities: [CAPABILITY_NAMED_IAM]
      OperationPreferences: { MaxConcurrentPercentage: 100, FailureTolerancePercentage: 100, RegionConcurrencyType: PARALLEL }
      Parameters:
        - { ParameterKey: ToolsAccountId, ParameterValue: !Ref AWS::AccountId }
        - { ParameterKey: AppPrincipalArn, ParameterValue: !GetAtt VmRole.Arn }
        - { ParameterKey: ExternalId, ParameterValue: !Select [2, !Split ["/", !Ref AWS::StackId]] }
      StackInstancesGroup:
        - Regions: [!Ref AWS::Region]
          DeploymentTargets: !If
            - HasExcluded
            - { OrganizationalUnitIds: !Ref ScopeOrganizationalUnitIds, AccountFilterType: DIFFERENCE, Accounts: !Ref ExcludedAccountIds }
            - { OrganizationalUnitIds: !Ref ScopeOrganizationalUnitIds }
      TemplateBody: |
        AWSTemplateFormatVersion: "2010-09-09"
        Description: >-
          DebugLogManager reader role. Read-only: lists resources and their current
          logging settings, so DebugLogManager can show what is on and never takes over
          logging it didn't turn on. Deployed to every account in scope (as a StackSet
          from the install stack, or as a plain stack in account-list mode).
        Parameters:
          ToolsAccountId:
            Type: String
            AllowedPattern: "^[0-9]{12}$"
            Description: The account DebugLogManager runs in.
          AppPrincipalArn:
            Type: String
            Description: >-
              The IAM role DebugLogManager runs as in the tools account (its VM role),
              matched with ArnLike, so a wildcard is allowed.
          ExternalId:
            Type: String
            MinLength: 8
            NoEcho: true
            Description: The install's ExternalId. DebugLogManager sends it on every assume.
          IdentityCenterReader:
            Type: String
            AllowedValues: ["false", "true"]
            Default: "false"
            Description: >-
              true only in the account that hosts IAM Identity Center (its delegated
              administrator): adds the four read actions that list a user's account
              assignments at sign-in.
        Conditions:
          ReadIdentityCenter: !Equals [!Ref IdentityCenterReader, "true"]
        Resources:
          ReaderRole:
            Type: AWS::IAM::Role
            Properties:
              RoleName: DebugLogManager-reader
              Description: Read-only role for DebugLogManager (lists resources and their logging settings).
              MaxSessionDuration: 3600
              AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Sid: DebugLogManagerOnly
                    Effect: Allow
                    Principal:
                      AWS: !Sub "arn:${AWS::Partition}:iam::${ToolsAccountId}:root"
                    Action: sts:AssumeRole
                    Condition:
                      StringEquals:
                        sts:ExternalId: !Ref ExternalId
                      ArnLike:
                        aws:PrincipalArn: !Ref AppPrincipalArn
                      "Null":
                        sts:SourceIdentity: "false"
                  - Sid: DebugLogManagerNamesWhoAsked
                    Effect: Allow
                    Principal:
                      AWS: !Sub "arn:${AWS::Partition}:iam::${ToolsAccountId}:root"
                    Action: sts:SetSourceIdentity
                    Condition:
                      ArnLike:
                        aws:PrincipalArn: !Ref AppPrincipalArn
                      StringLike:
                        sts:SourceIdentity: "?*"
              Policies:
                - PolicyName: read-logging-settings
                  PolicyDocument:
                    Version: "2012-10-17"
                    Statement:
                      - Sid: AccountName
                        Effect: Allow
                        Action: account:GetAccountInformation
                        Resource: "*"
                      - Sid: WorkerStackParameters
                        Effect: Allow
                        Action: cloudformation:DescribeStacks
                        Resource: !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/DebugLogManager-worker/*"
                      - Sid: ResourcesAndTheirLogging
                        Effect: Allow
                        Action:
                          - ec2:DescribeVpcs
                          - ec2:DescribeFlowLogs
                          - ec2:DescribeRegions
                          - elasticloadbalancing:DescribeLoadBalancers
                          - elasticloadbalancing:DescribeLoadBalancerAttributes
                          - elasticloadbalancing:DescribeTags
                          - s3:ListAllMyBuckets
                          - s3:GetBucketLocation
                          - s3:GetBucketLogging
                          - lambda:ListFunctions
                          - lambda:GetFunctionConfiguration
                          - cloudtrail:DescribeTrails
                          - cloudtrail:GetTrailStatus
                          - cloudtrail:GetEventSelectors
                          - cloudtrail:LookupEvents
                          - dynamodb:ListTables
                          - logs:DescribeLogGroups
                          - logs:DescribeSubscriptionFilters
                          - logs:DescribeMetricFilters
                          - logs:DescribeDeliverySources
                          - cloudwatch:GetMetricStatistics
                          - ec2:DescribeTransitGateways
                          - elasticloadbalancing:DescribeListeners
                          - network-firewall:ListFirewalls
                          - network-firewall:DescribeLoggingConfiguration
                          - logs:ListLogDeliveries
                          - route53resolver:ListResolverQueryLogConfigs
                          - route53resolver:ListResolverQueryLogConfigAssociations
                          - route53:ListHostedZones
                          - route53:ListQueryLoggingConfigs
                          - cloudfront:ListDistributions
                          - cloudfront:GetDistributionConfig
                          - wafv2:ListWebACLs
                          - wafv2:GetLoggingConfiguration
                          - apigateway:GET
                          - states:ListStateMachines
                          - states:DescribeStateMachine
                          - rds:DescribeDBInstances
                          - eks:ListClusters
                          - eks:DescribeCluster
                          - elasticache:DescribeReplicationGroups
                          - es:ListDomainNames
                          - es:DescribeDomain
                          - es:DescribeDomains
                        Resource: "*"
          IdentityCenterPolicy:
            Type: AWS::IAM::RolePolicy
            Condition: ReadIdentityCenter
            Properties:
              RoleName: !Ref ReaderRole
              PolicyName: read-identity-center-assignments
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Sid: AccountAssignments
                    Effect: Allow
                    Action:
                      - sso:ListInstances
                      - sso:ListAccountAssignmentsForPrincipal
                      - identitystore:GetUserId
                      - identitystore:ListGroupMembershipsForMember
                    Resource: "*"
        Outputs:
          ReaderRoleArn:
            Value: !GetAtt ReaderRole.Arn

  # Inert at install: nothing allowed, trust closed. An admin allows sources
  # per OU or account with update-stack-instances (DebugLogManager's Allowed
  # sources page shows the command).
  WorkerStackSet:
    Type: AWS::CloudFormation::StackSet
    Properties:
      StackSetName: DebugLogManager-worker
      Description: DebugLogManager worker role in every account in scope; inert until an admin allows sources.
      PermissionModel: SERVICE_MANAGED
      CallAs: DELEGATED_ADMIN
      AutoDeployment: { Enabled: true, RetainStacksOnAccountRemoval: false }
      ManagedExecution: { Active: true }
      Capabilities: [CAPABILITY_NAMED_IAM]
      OperationPreferences: { MaxConcurrentPercentage: 100, FailureTolerancePercentage: 100, RegionConcurrencyType: PARALLEL }
      Parameters:
        - { ParameterKey: ToolsAccountId, ParameterValue: !Ref AWS::AccountId }
        - { ParameterKey: AppPrincipalArn, ParameterValue: !GetAtt VmRole.Arn }
        - { ParameterKey: ExternalId, ParameterValue: !Select [2, !Split ["/", !Ref AWS::StackId]] }
      StackInstancesGroup:
        - Regions: [!Ref AWS::Region]
          DeploymentTargets: !If
            - HasExcluded
            - { OrganizationalUnitIds: !Ref ScopeOrganizationalUnitIds, AccountFilterType: DIFFERENCE, Accounts: !Ref ExcludedAccountIds }
            - { OrganizationalUnitIds: !Ref ScopeOrganizationalUnitIds }
      TemplateBody: |
        AWSTemplateFormatVersion: "2010-09-09"
        Description: >-
          DebugLogManager worker role: turns logging on and off for the sources an
          admin allows, in the regions allowed for each. Inert at install (nothing
          allowed, trust closed). Each parameter is one permission: a source's region
          list ("none" = not allowed), the global sources, and the two log group
          switches. Deployed to every account in scope, in one region only (IAM is
          global): as a StackSet from the install stack, or as a plain stack in
          account-list mode.
        Metadata:
          AWS::CloudFormation::Interface:
            ParameterGroups:
              - Label: { default: Install }
                Parameters: [ToolsAccountId, AppPrincipalArn, ExternalId]
              - Label: { default: "Allowed regions per source (comma separated, or none)" }
                Parameters:
                  - VpcFlowLogsRegions
                  - TgwFlowLogsRegions
                  - NetworkFirewallRegions
                  - ResolverQueryLogsRegions
                  - AlbAccessLogsRegions
                  - NlbAccessLogsRegions
                  - WafLogsRegions
                  - ApiGatewayLogsRegions
                  - ApiGatewayExecutionRegions
                  - CloudtrailDataEventsRegions
                  - S3AccessLogsRegions
                  - LambdaDebugRegions
                  - RdsLogExportsRegions
                  - EksControlPlaneRegions
                  - StepFunctionsLogsRegions
                  - ElasticacheLogsRegions
                  - OpensearchLogsRegions
                  - CloudwatchReadRegions
              - Label: { default: Global sources and log groups }
                Parameters: [AllowedGlobalSources, AllowRetentionChanges, AllowLogGroupDelete]
        Parameters:
          ToolsAccountId:
            Type: String
            AllowedPattern: "^[0-9]{12}$"
          AppPrincipalArn:
            Type: String
            Description: The role DebugLogManager runs as in the tools account (ArnLike, wildcards allowed).
          ExternalId:
            Type: String
            MinLength: 8
            NoEcho: true
          VpcFlowLogsRegions: { Type: String, Default: none }
          TgwFlowLogsRegions: { Type: String, Default: none }
          NetworkFirewallRegions: { Type: String, Default: none }
          ResolverQueryLogsRegions: { Type: String, Default: none }
          AlbAccessLogsRegions: { Type: String, Default: none }
          NlbAccessLogsRegions: { Type: String, Default: none }
          WafLogsRegions: { Type: String, Default: none }
          ApiGatewayLogsRegions: { Type: String, Default: none }
          ApiGatewayExecutionRegions: { Type: String, Default: none }
          CloudtrailDataEventsRegions: { Type: String, Default: none }
          S3AccessLogsRegions: { Type: String, Default: none }
          LambdaDebugRegions: { Type: String, Default: none }
          RdsLogExportsRegions: { Type: String, Default: none }
          EksControlPlaneRegions: { Type: String, Default: none }
          StepFunctionsLogsRegions: { Type: String, Default: none }
          ElasticacheLogsRegions: { Type: String, Default: none }
          OpensearchLogsRegions: { Type: String, Default: none }
          CloudwatchReadRegions:
            Type: String
            Default: none
            Description: Read existing CloudWatch log groups (application logs can hold customer data).
          AllowedGlobalSources:
            Type: String
            Default: none
            Description: cloudfront-logs, route53-query-logs, waf-cloudfront-logs (comma separated), or none. All through us-east-1.
          AllowRetentionChanges:
            Type: String
            AllowedValues: ["false", "true"]
            Default: "false"
          AllowLogGroupDelete:
            Type: String
            AllowedValues: ["false", "true"]
            Default: "false"
        Conditions:
          VpcOn: !Not [!Equals [!Ref VpcFlowLogsRegions, none]]
          TgwOn: !Not [!Equals [!Ref TgwFlowLogsRegions, none]]
          NfwOn: !Not [!Equals [!Ref NetworkFirewallRegions, none]]
          DnsOn: !Not [!Equals [!Ref ResolverQueryLogsRegions, none]]
          AlbOn: !Not [!Equals [!Ref AlbAccessLogsRegions, none]]
          NlbOn: !Not [!Equals [!Ref NlbAccessLogsRegions, none]]
          WafOn: !Not [!Equals [!Ref WafLogsRegions, none]]
          ApigwOn: !Not [!Equals [!Ref ApiGatewayLogsRegions, none]]
          ApigwxOn: !Not [!Equals [!Ref ApiGatewayExecutionRegions, none]]
          CtdeOn: !Not [!Equals [!Ref CloudtrailDataEventsRegions, none]]
          S3alOn: !Not [!Equals [!Ref S3AccessLogsRegions, none]]
          LambdaOn: !Not [!Equals [!Ref LambdaDebugRegions, none]]
          RdsOn: !Not [!Equals [!Ref RdsLogExportsRegions, none]]
          EksOn: !Not [!Equals [!Ref EksControlPlaneRegions, none]]
          SfnOn: !Not [!Equals [!Ref StepFunctionsLogsRegions, none]]
          EcOn: !Not [!Equals [!Ref ElasticacheLogsRegions, none]]
          OsOn: !Not [!Equals [!Ref OpensearchLogsRegions, none]]
          CwReadOn: !Not [!Equals [!Ref CloudwatchReadRegions, none]]
          GlobalOn: !Not [!Equals [!Ref AllowedGlobalSources, none]]
          CfOn: !Not [!Equals [!Join ["", !Split ["cloudfront-logs", !Ref AllowedGlobalSources]], !Ref AllowedGlobalSources]]
          R53On: !Not [!Equals [!Join ["", !Split ["route53-query-logs", !Ref AllowedGlobalSources]], !Ref AllowedGlobalSources]]
          WafCfOn: !Not [!Equals [!Join ["", !Split ["waf-cloudfront-logs", !Ref AllowedGlobalSources]], !Ref AllowedGlobalSources]]
          AnyAllowed: !Or
            - !Or [!Condition VpcOn, !Condition TgwOn, !Condition NfwOn, !Condition DnsOn, !Condition AlbOn,
                   !Condition NlbOn, !Condition WafOn, !Condition ApigwOn, !Condition ApigwxOn, !Condition CtdeOn]
            - !Or [!Condition S3alOn, !Condition LambdaOn, !Condition RdsOn, !Condition EksOn, !Condition SfnOn,
                   !Condition EcOn, !Condition OsOn, !Condition CwReadOn, !Condition GlobalOn]
          FlowLogsOn: !Or [!Condition VpcOn, !Condition TgwOn]
          ApigwAny: !Or [!Condition ApigwOn, !Condition ApigwxOn]
          AnyBucketSource: !Or [!Condition VpcOn, !Condition TgwOn, !Condition NfwOn, !Condition DnsOn, !Condition AlbOn,
                                !Condition NlbOn, !Condition CtdeOn, !Condition S3alOn, !Condition CfOn]
          AnyGroupSource: !Or
            - !Or [!Condition VpcOn, !Condition TgwOn, !Condition NfwOn, !Condition DnsOn, !Condition WafOn]
            - !Or [!Condition ApigwOn, !Condition SfnOn, !Condition EcOn, !Condition OsOn, !Condition GlobalOn]
          AnyVended: !Or
            - !Or [!Condition VpcOn, !Condition TgwOn, !Condition NfwOn, !Condition DnsOn, !Condition NlbOn]
            - !Or [!Condition WafOn, !Condition SfnOn, !Condition EcOn, !Condition GlobalOn]
          AnyResourcePolicy: !Or [!Condition NfwOn, !Condition DnsOn, !Condition WafOn, !Condition SfnOn,
                                  !Condition EcOn, !Condition OsOn, !Condition GlobalOn]
          NetworkOn: !Or [!Condition VpcOn, !Condition TgwOn, !Condition NfwOn, !Condition DnsOn, !Condition AlbOn, !Condition NlbOn]
          EdgeOn: !Or [!Condition WafOn, !Condition ApigwOn, !Condition ApigwxOn, !Condition GlobalOn]
          ComputeOn: !Or [!Condition CtdeOn, !Condition S3alOn, !Condition LambdaOn, !Condition RdsOn, !Condition EksOn,
                          !Condition SfnOn, !Condition EcOn, !Condition OsOn, !Condition CwReadOn]
          RetentionOn: !Equals [!Ref AllowRetentionChanges, "true"]
          DeleteOn: !Equals [!Ref AllowLogGroupDelete, "true"]
          AnyLogGroupChange: !Or [!Condition RetentionOn, !Condition DeleteOn]
        Resources:
          WorkerRole:
            Type: AWS::IAM::Role
            Properties:
              RoleName: DebugLogManager-worker
              Description: DebugLogManager turns logging on and off with this role, within what the stack parameters allow.
              MaxSessionDuration: 3600
              AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - !If
                    - AnyAllowed
                    - Sid: DebugLogManagerNamesWhoAsked
                      Effect: Allow
                      Principal:
                        AWS: !Sub "arn:${AWS::Partition}:iam::${ToolsAccountId}:root"
                      Action: sts:SetSourceIdentity
                      Condition:
                        ArnLike:
                          aws:PrincipalArn: !Ref AppPrincipalArn
                        StringLike:
                          sts:SourceIdentity: "?*"
                    - !Ref AWS::NoValue
                  - !If
                    - AnyAllowed
                    - Sid: DebugLogManagerOnly
                      Effect: Allow
                      Principal:
                        AWS: !Sub "arn:${AWS::Partition}:iam::${ToolsAccountId}:root"
                      Action: sts:AssumeRole
                      Condition:
                        StringEquals:
                          sts:ExternalId: !Ref ExternalId
                        ArnLike:
                          aws:PrincipalArn: !Ref AppPrincipalArn
                        "Null":
                          sts:SourceIdentity: "false"
                    - Sid: InertNothingAllowed
                      Effect: Deny
                      Principal:
                        AWS: !Sub "arn:${AWS::Partition}:iam::${ToolsAccountId}:root"
                      Action: ["sts:AssumeRole", "sts:SetSourceIdentity"]
              Policies:
                - PolicyName: guards
                  PolicyDocument:
                    Version: "2012-10-17"
                    Statement:
                      - Sid: NeverControlTower
                        Effect: Deny
                        Action: ["logs:PutRetentionPolicy", "logs:DeleteRetentionPolicy", "logs:DeleteLogGroup"]
                        Resource: !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:*aws-controltower*"
          DestinationsPolicy:
            Type: AWS::IAM::ManagedPolicy
            Condition: AnyAllowed
            Properties:
              ManagedPolicyName: DebugLogManager-worker-destinations
              Roles: [!Ref WorkerRole]
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - !If
                    - AnyBucketSource
                    - Sid: OwnBuckets
                      Effect: Allow
                      Action:
                        - s3:CreateBucket
                        - s3:PutBucketTagging
                        - s3:GetBucketTagging
                        - s3:PutEncryptionConfiguration
                        - s3:PutBucketPublicAccessBlock
                        - s3:PutLifecycleConfiguration
                        - s3:PutBucketOwnershipControls
                        - s3:PutBucketPolicy
                        - s3:GetBucketPolicy
                        - s3:GetBucketLocation
                        - s3:ListBucket
                        - s3:ListBucketVersions
                        - s3:DeleteBucket
                      Resource: !Sub "arn:${AWS::Partition}:s3:::dlm-*"
                      Condition:
                        StringEquals:
                          aws:RequestedRegion: !Split [",", !Join [",", [!Ref VpcFlowLogsRegions, !Ref TgwFlowLogsRegions, !Ref NetworkFirewallRegions,
                            !Ref ResolverQueryLogsRegions, !Ref AlbAccessLogsRegions, !Ref NlbAccessLogsRegions, !Ref CloudtrailDataEventsRegions,
                            !Ref S3AccessLogsRegions, !If [CfOn, us-east-1, none]]]]
                    - !Ref AWS::NoValue
                  - !If
                    - AnyBucketSource
                    - Sid: OwnBucketObjects
                      Effect: Allow
                      Action: ["s3:GetObject", "s3:DeleteObject", "s3:DeleteObjectVersion"]
                      Resource: !Sub "arn:${AWS::Partition}:s3:::dlm-*/*"
                      Condition:
                        StringEquals:
                          aws:RequestedRegion: !Split [",", !Join [",", [!Ref VpcFlowLogsRegions, !Ref TgwFlowLogsRegions, !Ref NetworkFirewallRegions,
                            !Ref ResolverQueryLogsRegions, !Ref AlbAccessLogsRegions, !Ref NlbAccessLogsRegions, !Ref CloudtrailDataEventsRegions,
                            !Ref S3AccessLogsRegions, !If [CfOn, us-east-1, none]]]]
                    - !Ref AWS::NoValue
                  - !If
                    - AnyGroupSource
                    - Sid: OwnLogGroups
                      Effect: Allow
                      Action: ["logs:CreateLogGroup", "logs:PutRetentionPolicy", "logs:TagResource", "logs:TagLogGroup", "logs:DeleteLogGroup",
                               "logs:FilterLogEvents", "logs:GetLogEvents", "logs:DescribeLogStreams"]
                      Resource:
                        - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/debuglogmanager/*"
                        - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:aws-waf-logs-dlm-*"
                        - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/route53/dlm-*"
                      Condition:
                        StringEquals:
                          aws:RequestedRegion: !Split [",", !Join [",", [!Ref VpcFlowLogsRegions, !Ref TgwFlowLogsRegions, !Ref NetworkFirewallRegions,
                            !Ref ResolverQueryLogsRegions, !Ref WafLogsRegions, !Ref ApiGatewayLogsRegions, !Ref StepFunctionsLogsRegions,
                            !Ref ElasticacheLogsRegions, !Ref OpensearchLogsRegions, !If [GlobalOn, us-east-1, none]]]]
                    - !Ref AWS::NoValue
                  - Sid: FindLogGroups
                    Effect: Allow
                    Action: logs:DescribeLogGroups
                    Resource: "*"
                  - !If
                    - AnyVended
                    - Sid: VendedLogDelivery
                      Effect: Allow
                      Action: ["logs:CreateLogDelivery", "logs:GetLogDelivery", "logs:UpdateLogDelivery", "logs:DeleteLogDelivery", "logs:ListLogDeliveries"]
                      Resource: "*"
                    - !Ref AWS::NoValue
                  - !If
                    - AnyResourcePolicy
                    - Sid: LogGroupResourcePolicy
                      Effect: Allow
                      Action: ["logs:PutResourcePolicy", "logs:DescribeResourcePolicies"]
                      Resource: "*"
                    - !Ref AWS::NoValue
          FlowLogsDeliveryRole:
            Type: AWS::IAM::Role
            Condition: FlowLogsOn
            Properties:
              RoleName: DebugLogManager-flowlogs-delivery
              Description: VPC and Transit Gateway flow logs write DebugLogManager's flow logs to its log groups with this role.
              AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Principal: { Service: vpc-flow-logs.amazonaws.com }
                    Action: sts:AssumeRole
                    Condition: { StringEquals: { aws:SourceAccount: !Ref AWS::AccountId } }
              Policies:
                - PolicyName: write-own-log-groups
                  PolicyDocument:
                    Version: "2012-10-17"
                    Statement:
                      - Effect: Allow
                        Action: ["logs:CreateLogStream", "logs:PutLogEvents", "logs:DescribeLogGroups", "logs:DescribeLogStreams"]
                        Resource:
                          - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/debuglogmanager/vpc-flow-logs/*"
                          - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/debuglogmanager/tgw-flow-logs/*"
          ApiGatewayCloudWatchRole:
            Type: AWS::IAM::Role
            Condition: ApigwAny
            Properties:
              RoleName: DebugLogManager-apigateway-cloudwatch
              Description: API Gateway writes access and execution logs with this role (set on the account only if it had none).
              AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Principal: { Service: apigateway.amazonaws.com }
                    Action: sts:AssumeRole
              ManagedPolicyArns:
                - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs"
          NetworkPolicy:
            Type: AWS::IAM::ManagedPolicy
            Condition: NetworkOn
            Properties:
              ManagedPolicyName: DebugLogManager-worker-network
              Roles: [!Ref WorkerRole]
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - !If
                    - VpcOn
                    - Sid: VpcFlowLogs
                      Effect: Allow
                      Action: ec2:CreateFlowLogs
                      Resource:
                        - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc/*"
                        - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc-flow-log/*"
                      Condition: { StringEquals: { aws:RequestedRegion: !Split [",", !Ref VpcFlowLogsRegions] } }
                    - !Ref AWS::NoValue
                  - !If
                    - TgwOn
                    - Sid: TgwFlowLogs
                      Effect: Allow
                      Action: ec2:CreateFlowLogs
                      Resource:
                        - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:transit-gateway/*"
                        - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc-flow-log/*"
                      Condition: { StringEquals: { aws:RequestedRegion: !Split [",", !Ref TgwFlowLogsRegions] } }
                    - !Ref AWS::NoValue
                  - !If
                    - FlowLogsOn
                    - Sid: TagAndDeleteOwnFlowLogs
                      Effect: Allow
                      Action: ["ec2:CreateTags", "ec2:DeleteFlowLogs"]
                      Resource: !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc-flow-log/*"
                      Condition:
                        StringEquals:
                          aws:RequestedRegion: !Split [",", !Join [",", [!Ref VpcFlowLogsRegions, !Ref TgwFlowLogsRegions]]]
                          aws:ResourceTag/dlm:managed: "true"
                    - !Ref AWS::NoValue
                  - !If
                    - FlowLogsOn
                    - Sid: TagOnCreate
                      Effect: Allow
                      Action: ec2:CreateTags
                      Resource: !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc-flow-log/*"
                      Condition:
                        StringEquals:
                          ec2:CreateAction: CreateFlowLogs
                          aws:RequestedRegion: !Split [",", !Join [",", [!Ref VpcFlowLogsRegions, !Ref TgwFlowLogsRegions]]]
                    - !Ref AWS::NoValue
                  - !If
                    - FlowLogsOn
                    - Sid: DescribeFlowLogs
                      Effect: Allow
                      Action: ec2:DescribeFlowLogs
                      Resource: "*"
                    - !Ref AWS::NoValue
                  - !If
                    - FlowLogsOn
                    - Sid: PassFlowLogsDeliveryRole
                      Effect: Allow
                      Action: iam:PassRole
                      Resource: !GetAtt FlowLogsDeliveryRole.Arn
                      Condition: { StringEquals: { iam:PassedToService: vpc-flow-logs.amazonaws.com } }
                    - !Ref AWS::NoValue
                  - !If
                    - NfwOn
                    - Sid: NetworkFirewallLogging
                      Effect: Allow
                      Action: ["network-firewall:UpdateLoggingConfiguration", "network-firewall:DescribeLoggingConfiguration"]
                      Resource: !Sub "arn:${AWS::Partition}:network-firewall:*:${AWS::AccountId}:firewall/*"
                      Condition: { StringEquals: { aws:RequestedRegion: !Split [",", !Ref NetworkFirewallRegions] } }
                    - !Ref AWS::NoValue
                  - !If
                    - DnsOn
                    - Sid: ResolverQueryLogs
                      Effect: Allow
                      Action:
                        - route53resolver:CreateResolverQueryLogConfig
                        - route53resolver:AssociateResolverQueryLogConfig
                        - route53resolver:DisassociateResolverQueryLogConfig
                        - route53resolver:DeleteResolverQueryLogConfig
                        - route53resolver:GetResolverQueryLogConfig
                        - route53resolver:ListResolverQueryLogConfigs
                        - route53resolver:ListResolverQueryLogConfigAssociations
                        - route53resolver:TagResource
                        - ec2:DescribeVpcs
                      Resource: "*"
                      Condition: { StringEquals: { aws:RequestedRegion: !Split [",", !Ref ResolverQueryLogsRegions] } }
                    - !Ref AWS::NoValue
                  - !If
                    - DnsOn
                    - Sid: ResolverServiceLinkedRole
                      Effect: Allow
                      Action: iam:CreateServiceLinkedRole
                      Resource: "*"
                      Condition: { StringEquals: { iam:AWSServiceName: route53resolver.amazonaws.com } }
                    - !Ref AWS::NoValue
                  - !If
                    - AlbOn
                    - Sid: AlbAccessLogs
                      Effect: Allow
                      Action: ["elasticloadbalancing:ModifyLoadBalancerAttributes", "elasticloadbalancing:DescribeLoadBalancerAttributes"]
                      Resource: !Sub "arn:${AWS::Partition}:elasticloadbalancing:*:${AWS::AccountId}:loadbalancer/app/*/*"
                      Condition: { StringEquals: { aws:RequestedRegion: !Split [",", !Ref AlbAccessLogsRegions] } }
                    - !Ref AWS::NoValue
                  - !If
                    - NlbOn
                    - Sid: NlbAccessLogs
                      Effect: Allow
                      Action: ["elasticloadbalancing:ModifyLoadBalancerAttributes", "elasticloadbalancing:DescribeLoadBalancerAttributes"]
                      Resource: !Sub "arn:${AWS::Partition}:elasticloadbalancing:*:${AWS::AccountId}:loadbalancer/net/*/*"
                      Condition: { StringEquals: { aws:RequestedRegion: !Split [",", !Ref NlbAccessLogsRegions] } }
                    - !Ref AWS::NoValue
                  - Sid: DescribeLoadBalancerAttributes
                    Effect: Allow
                    Action: elasticloadbalancing:DescribeLoadBalancerAttributes
                    Resource: "*"
          EdgePolicy:
            Type: AWS::IAM::ManagedPolicy
            Condition: EdgeOn
            Properties:
              ManagedPolicyName: DebugLogManager-worker-edge
              Roles: [!Ref WorkerRole]
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - !If
                    - CfOn
                    - Sid: CloudFrontLogDelivery
                      Effect: Allow
                      Action:
                        - logs:PutDeliverySource
                        - logs:GetDeliverySource
                        - logs:DeleteDeliverySource
                        - logs:PutDeliveryDestination
                        - logs:GetDeliveryDestination
                        - logs:DeleteDeliveryDestination
                        - logs:CreateDelivery
                        - logs:GetDelivery
                        - logs:DeleteDelivery
                        - logs:DescribeDeliveries
                        - logs:DescribeDeliverySources
                        - logs:TagResource
                        - cloudfront:AllowVendedLogDeliveryForResource
                      Resource: "*"
                      Condition: { StringEquals: { aws:RequestedRegion: us-east-1 } }
                    - !Ref AWS::NoValue
                  - !If
                    - WafOn
                    - Sid: WafRegionalLogging
                      Effect: Allow
                      Action: ["wafv2:PutLoggingConfiguration", "wafv2:DeleteLoggingConfiguration", "wafv2:GetLoggingConfiguration"]
                      Resource: !Sub "arn:${AWS::Partition}:wafv2:*:${AWS::AccountId}:regional/webacl/*/*"
                      Condition: { StringEquals: { aws:RequestedRegion: !Split [",", !Ref WafLogsRegions] } }
                    - !Ref AWS::NoValue
                  - !If
                    - WafCfOn
                    - Sid: WafCloudFrontLogging
                      Effect: Allow
                      Action: ["wafv2:PutLoggingConfiguration", "wafv2:DeleteLoggingConfiguration", "wafv2:GetLoggingConfiguration"]
                      Resource: !Sub "arn:${AWS::Partition}:wafv2:us-east-1:${AWS::AccountId}:global/webacl/*/*"
                    - !Ref AWS::NoValue
                  - !If
                    - ApigwAny
                    - Sid: ApiGatewayStageLogging
                      Effect: Allow
                      Action: ["apigateway:GET", "apigateway:PATCH"]
                      Resource:
                        - !Sub "arn:${AWS::Partition}:apigateway:*::/restapis/*/stages/*"
                        - !Sub "arn:${AWS::Partition}:apigateway:*::/account"
                      Condition:
                        StringEquals:
                          aws:RequestedRegion: !Split [",", !Join [",", [!Ref ApiGatewayLogsRegions, !Ref ApiGatewayExecutionRegions]]]
                    - !Ref AWS::NoValue
                  - !If
                    - ApigwAny
                    - Sid: ApiGatewayAccountRole
                      Effect: Allow
                      Action: iam:PassRole
                      Resource: !GetAtt ApiGatewayCloudWatchRole.Arn
                      Condition: { StringEquals: { iam:PassedToService: apigateway.amazonaws.com } }
                    - !Ref AWS::NoValue
                  - !If
                    - ApigwxOn
                    - Sid: ReadExecutionLogs
                      Effect: Allow
                      Action: ["logs:FilterLogEvents", "logs:GetLogEvents"]
                      Resource: !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:API-Gateway-Execution-Logs_*"
                      Condition: { StringEquals: { aws:RequestedRegion: !Split [",", !Ref ApiGatewayExecutionRegions] } }
                    - !Ref AWS::NoValue
                  - !If
                    - R53On
                    - Sid: Route53QueryLogging
                      Effect: Allow
                      Action: ["route53:CreateQueryLoggingConfig", "route53:DeleteQueryLoggingConfig", "route53:GetQueryLoggingConfig",
                               "route53:ListQueryLoggingConfigs"]
                      Resource: "*"
                    - !Ref AWS::NoValue
                  - !If
                    - EdgeOn
                    - Sid: AlwaysOneStatement
                      Effect: Allow
                      Action: wafv2:ListWebACLs
                      Resource: "*"
                    - !Ref AWS::NoValue
          ComputePolicy:
            Type: AWS::IAM::ManagedPolicy
            Condition: ComputeOn
            Properties:
              ManagedPolicyName: DebugLogManager-worker-compute
              Roles: [!Ref WorkerRole]
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - !If
                    - CtdeOn
                    - Sid: OwnTrailsOnly
                      Effect: Allow
                      Action: ["cloudtrail:CreateTrail", "cloudtrail:AddTags", "cloudtrail:PutEventSelectors", "cloudtrail:GetEventSelectors",
                               "cloudtrail:StartLogging", "cloudtrail:StopLogging", "cloudtrail:GetTrailStatus", "cloudtrail:DeleteTrail"]
                      Resource: !Sub "arn:${AWS::Partition}:cloudtrail:*:${AWS::AccountId}:trail/dlm-*"
                      Condition: { StringEquals: { aws:RequestedRegion: !Split [",", !Ref CloudtrailDataEventsRegions] } }
                    - !Ref AWS::NoValue
                  - !If
                    - CtdeOn
                    - Sid: ScpCheckBeforeTrail
                      Effect: Allow
                      Action: iam:SimulatePrincipalPolicy
                      Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/DebugLogManager-worker"
                    - !Ref AWS::NoValue
                  - !If
                    - S3alOn
                    - Sid: BucketLogging
                      Effect: Allow
                      Action: ["s3:PutBucketLogging", "s3:GetBucketLogging"]
                      Resource: !Sub "arn:${AWS::Partition}:s3:::*"
                      Condition: { StringEquals: { aws:RequestedRegion: !Split [",", !Ref S3AccessLogsRegions] } }
                    - !Ref AWS::NoValue
                  - !If
                    - LambdaOn
                    - Sid: LambdaLoggingConfig
                      Effect: Allow
                      Action: ["lambda:UpdateFunctionConfiguration", "lambda:GetFunctionConfiguration"]
                      Resource: !Sub "arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:*"
                      Condition: { StringEquals: { aws:RequestedRegion: !Split [",", !Ref LambdaDebugRegions] } }
                    - !Ref AWS::NoValue
                  - !If
                    - SfnOn
                    - Sid: StepFunctionsLogging
                      Effect: Allow
                      Action: ["states:DescribeStateMachine", "states:UpdateStateMachine"]
                      Resource: !Sub "arn:${AWS::Partition}:states:*:${AWS::AccountId}:stateMachine:*"
                      Condition: { StringEquals: { aws:RequestedRegion: !Split [",", !Ref StepFunctionsLogsRegions] } }
                    - !Ref AWS::NoValue
                  - !If
                    - RdsOn
                    - Sid: RdsLogExports
                      Effect: Allow
                      Action: ["rds:ModifyDBInstance", "rds:DescribeDBInstances", "rds:DescribeDBEngineVersions"]
                      Resource: "*"
                      Condition: { StringEquals: { aws:RequestedRegion: !Split [",", !Ref RdsLogExportsRegions] } }
                    - !Ref AWS::NoValue
                  - !If
                    - EksOn
                    - Sid: EksControlPlaneLogging
                      Effect: Allow
                      Action: ["eks:DescribeCluster", "eks:UpdateClusterConfig", "eks:DescribeUpdate"]
                      Resource: !Sub "arn:${AWS::Partition}:eks:*:${AWS::AccountId}:cluster/*"
                      Condition: { StringEquals: { aws:RequestedRegion: !Split [",", !Ref EksControlPlaneRegions] } }
                    - !Ref AWS::NoValue
                  - !If
                    - EcOn
                    - Sid: ElastiCacheLogDelivery
                      Effect: Allow
                      Action: ["elasticache:ModifyReplicationGroup", "elasticache:DescribeReplicationGroups"]
                      Resource: "*"
                      Condition: { StringEquals: { aws:RequestedRegion: !Split [",", !Ref ElasticacheLogsRegions] } }
                    - !Ref AWS::NoValue
                  - !If
                    - OsOn
                    - Sid: OpenSearchLogPublishing
                      Effect: Allow
                      Action: ["es:DescribeDomain", "es:UpdateDomainConfig"]
                      Resource: !Sub "arn:${AWS::Partition}:es:*:${AWS::AccountId}:domain/*"
                      Condition: { StringEquals: { aws:RequestedRegion: !Split [",", !Ref OpensearchLogsRegions] } }
                    - !Ref AWS::NoValue
                  - !If
                    - LambdaOn
                    - Sid: ReadLambdaLogs
                      Effect: Allow
                      Action: ["logs:FilterLogEvents", "logs:GetLogEvents"]
                      Resource: !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/*"
                      Condition: { StringEquals: { aws:RequestedRegion: !Split [",", !Ref LambdaDebugRegions] } }
                    - !Ref AWS::NoValue
                  - !If
                    - RdsOn
                    - Sid: ReadRdsLogs
                      Effect: Allow
                      Action: ["logs:FilterLogEvents", "logs:GetLogEvents"]
                      Resource: !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/rds/*"
                      Condition: { StringEquals: { aws:RequestedRegion: !Split [",", !Ref RdsLogExportsRegions] } }
                    - !Ref AWS::NoValue
                  - !If
                    - EksOn
                    - Sid: ReadEksLogs
                      Effect: Allow
                      Action: ["logs:FilterLogEvents", "logs:GetLogEvents"]
                      Resource: !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/eks/*"
                      Condition: { StringEquals: { aws:RequestedRegion: !Split [",", !Ref EksControlPlaneRegions] } }
                    - !Ref AWS::NoValue
                  - !If
                    - CwReadOn
                    - Sid: ReadExistingLogGroups
                      Effect: Allow
                      Action: ["logs:DescribeLogGroups", "logs:DescribeLogStreams", "logs:FilterLogEvents", "logs:GetLogEvents"]
                      Resource: "*"
                      Condition: { StringEquals: { aws:RequestedRegion: !Split [",", !Ref CloudwatchReadRegions] } }
                    - !Ref AWS::NoValue
                  - !If
                    - ComputeOn
                    - Sid: AlwaysOneStatement
                      Effect: Allow
                      Action: lambda:GetAccountSettings
                      Resource: "*"
                    - !Ref AWS::NoValue
          LogGroupChangesPolicy:
            Type: AWS::IAM::RolePolicy
            Condition: AnyLogGroupChange
            Properties:
              RoleName: !Ref WorkerRole
              PolicyName: log-group-changes
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - !If
                    - RetentionOn
                    - Sid: Retention
                      Effect: Allow
                      Action: ["logs:PutRetentionPolicy", "logs:DeleteRetentionPolicy"]
                      Resource: !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:*"
                    - !Ref AWS::NoValue
                  - !If
                    - DeleteOn
                    - Sid: DeleteServiceLogGroups
                      Effect: Allow
                      Action: logs:DeleteLogGroup
                      Resource:
                        - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/*"
                        - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/codebuild/*"
                        - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/rds/*"
                        - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/eks/*"
                        - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:API-Gateway-Execution-Logs_*"
                    - !Ref AWS::NoValue
        Outputs:
          WorkerRoleArn:
            Value: !GetAtt WorkerRole.Arn

Outputs:
  ExternalId:
    Description: The install's ExternalId (the management stack needs it).
    Value: !Select [2, !Split ["/", !Ref AWS::StackId]]
  VmInstanceId:
    Value: !Ref Vm
  StateBucket:
    Value: !Ref StateBucket
  VmRoleArn:
    Value: !GetAtt VmRole.Arn
